name: pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      force_infra:
        description: Run Terraform even if infra/ did not change
        type: boolean
        default: false

# One run at a time. Two Terraform applies on the same state would clash.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # needed for the OIDC login to AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  TF_VERSION: 1.16.7
  TRIVY_VERSION: v0.76.1
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.decide.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check repository settings
        env:
          HAS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          missing=0
          for v in AWS_REGION TF_STATE_BUCKET ECR_REPOSITORY; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is missing (Settings > Secrets and variables > Actions > Variables)"
              missing=1
            fi
          done
          if [ "$HAS_ROLE" != "true" ]; then
            echo "::error::Repository secret AWS_ROLE_ARN is missing (Settings > Secrets and variables > Actions > Secrets)"
            missing=1
          fi
          exit $missing

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: Decide if Terraform should run
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.force_infra }}
        run: |
          # How many resources does the state already have? (0 on the first run or after destroy)
          resources=$(aws s3 cp "s3://$TF_STATE_BUCKET/workshop/terraform.tfstate" - 2>/dev/null \
            | jq '[.resources[]? | select(.mode == "managed")] | length' || echo 0)

          if [ "$FORCE" = "true" ]; then
            run=true; reason="started by hand with force_infra"
          elif [ "${resources:-0}" -eq 0 ]; then
            run=true; reason="no infrastructure yet"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            run=false; reason="manual run without force_infra"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            run=true; reason="can't compare with the previous push"
          elif git diff --quiet "$BEFORE" HEAD -- infra/; then
            run=false; reason="infra/ did not change"
          else
            run=true; reason="infra/ changed"
          fi

          echo "infra=$run" >> "$GITHUB_OUTPUT"
          echo "Run Terraform: **$run** ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: terraform init
        run: scripts/tf-init.sh

      - name: terraform plan
        run: |
          terraform -chdir=infra plan -input=false -no-color -out=tfplan | tee plan.txt
          grep -E '^(Plan:|No changes)' plan.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: terraform apply
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Wait for the k3d cluster
        run: scripts/ssm-exec.sh "$(terraform -chdir=infra output -raw instance_id)" scripts/wait-ready.sh 900

  build:
    name: Test, build, scan, push
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Unit tests
        working-directory: app
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -v

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # the image tag and the version shown in the app are the first 12 chars of the commit
          version=${GITHUB_SHA::12}
          image=$REGISTRY/$ECR_REPOSITORY:$version
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --build-arg APP_VERSION="$version" -t "$image" app

      - name: Install Trivy
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/$TRIVY_VERSION/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "$TRIVY_VERSION"

      - name: Trivy report (HIGH, CRITICAL)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"

      # Fails the build on a CRITICAL issue that has a fix.
      # Repo variable TRIVY_EXIT_CODE=0 turns this into a warning (workshop emergencies only).
      - name: Security gate
        env:
          EXIT_CODE: ${{ vars.TRIVY_EXIT_CODE || '1' }}
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code "$EXIT_CODE" "$IMAGE"

      - name: Push to ECR
        run: |
          docker push "$IMAGE"
          echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Kubernetes
    needs: [changes, terraform, build]
    # Terraform is skipped on app-only pushes, and by default GitHub then skips
    # every job that needs it. always() turns that off; the rest decides for real.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      # works even when the Terraform job was skipped: the values live in S3
      - name: Read Terraform outputs
        id: infra
        run: |
          scripts/tf-init.sh > /dev/null
          echo "instance_id=$(terraform -chdir=infra output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform -chdir=infra output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Render manifests
        run: |
          version=${GITHUB_SHA::12}
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com

          mkdir -p build
          for f in k8s/*.yaml; do
            sed -e "s|IMAGE_PLACEHOLDER|$registry/$ECR_REPOSITORY:$version|" \
                -e "s|VERSION_PLACEHOLDER|$version|" "$f"
            echo "---"
          done > build/manifests.yaml

          {
            echo "export AWS_REGION=$AWS_REGION ECR_REGISTRY=$registry APP_VERSION=$version"
            echo "echo $(base64 -w0 build/manifests.yaml) | base64 -d > /tmp/manifests.yaml"
            cat scripts/remote-deploy.sh
          } > build/deploy.sh

          cat build/manifests.yaml

      - name: Deploy through SSM
        run: scripts/ssm-exec.sh "${{ steps.infra.outputs.instance_id }}" build/deploy.sh 600

      - name: Health check
        env:
          IP: ${{ steps.infra.outputs.public_ip }}
        run: |
          version=${GITHUB_SHA::12}
          # no Ingress yet (before Lab 3) -> check through the NodePort
          if [ -f k8s/ingress.yaml ]; then url=http://$IP/; else url=http://$IP:30080/; fi

          for i in $(seq 30); do
            live=$(curl -fsS --max-time 5 "${url}healthz" 2>/dev/null | jq -r .version 2>/dev/null || true)
            if [ "$live" = "$version" ]; then
              echo "$version is live at $url"
              echo "### Live: [$url]($url) (version \`$version\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "[$i/30] waiting for $version at ${url}healthz (now: ${live:-no answer})"
            sleep 10
          done

          echo "::error::$url never answered with version $version. Check k8s/service.yaml and k8s/ingress.yaml."
          exit 1
